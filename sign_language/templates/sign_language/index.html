<!DOCTYPE html>
<html>
<head>
    <title>Sign Language Recognition</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #video {
            border: 2px solid black;
            width: 640px;
            height: 480px;
        }
        #prediction {
            font-size: 1.5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Sign Language Recognition</h1>
    <img id="video" src="/video_feed" alt="Video Feed" />
    <h3 id="prediction">Prediction: Waiting...</h3>

    <script>
        function getPrediction() {
            fetch('/predict')
                .then(response => response.json())
                .then(data => {
                    if (data.sign) {
                        document.getElementById('prediction').innerText = 
                            `Prediction: ${data.sign} (${data.confidence}%)`;
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // Update prediction every 1 second
        setInterval(getPrediction, 1000);
    </script>
</body>
</html>
